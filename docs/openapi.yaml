openapi: 3.1.0
info:
  title: Truck Map HTTP API
  version: 1.0.0
servers:
  - url: http://localhost:8000
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /api/v1/state:
    get:
      summary: Snapshot state
      responses:
        '200':
          description: Current state
          content:
            application/json:
              schema:
                $ref: ./schemas/state.json
  /api/v1/settings:
    get:
      summary: Current retention settings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: ./schemas/settings.json
    patch:
      summary: Update retention settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                trace_mode:
                  type: string
                  enum: [seconds, samples]
                trace_seconds:
                  type: integer
                  minimum: 1
                trace_samples:
                  type: integer
                  minimum: 1
              minProperties: 1
      responses:
        '200':
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: ./schemas/settings.json
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code:
                        type: string
                      message:
                        type: string
